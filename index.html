<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Linux VM (v86)</title>
    <link rel="icon" href="data:,">
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 { 
            margin-bottom: 10px; 
            font-size: 1.5rem; 
            color: #ffffff;
            font-weight: 300;
        }
        #status { 
            color: #00ff00; 
            margin-bottom: 20px; 
            font-size: 0.9rem; 
            font-family: monospace;
        }
        #screen_container {
            background: #000;
            border: 1px solid #333;
            padding: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border-radius: 4px;
        }
        #screen_container div { 
            white-space: pre; 
            font-family: monospace; 
            font-size: 14px; 
            line-height: 14px; 
            color: #fff;
        }
        .instructions {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1> Browser Linux VM</h1>
    <p id="status">エミュレーターを読み込み中...</p>
    
    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
        <canvas style="display: none"></canvas>
    </div>

    <div class="instructions">
        ログイン: <strong>root</strong> / パスワード: <strong>root</strong><br>
        終了: 右上のタブを閉じる
    </div>

    <!-- ✅ v86公式CDN (copy.sh) を使用 -->
    <script src="https://copy.sh/v86/build/libv86.js"></script>
    
    <script>
        const statusEl = document.getElementById('status');
        const screenContainer = document.getElementById('screen_container');

        if (typeof V86 === 'undefined') {
            statusEl.innerText = "❌ エラー: v86ライブラリの読み込みに失敗しました";
            statusEl.style.color = "red";
        } else {
            statusEl.innerText = "Linuxを起動中... (初回は1分ほどかかることがあります)";
            
            var emulator = new V86({
                wasm_path: "https://copy.sh/v86/build/v86.wasm",
                memory_size: 128 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                screen_container: screenContainer,
                bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
                vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
                
                // 軽量なLinuxイメージ
                cdrom: { url: "https://copy.sh/v86/images/alpine.iso" },
                
                autostart: true,
                
                start_cb: function() {
                    statusEl.innerText = "カーネル起動中...";
                },
                
                emulator_started_cb: function() {
                    statusEl.innerText = "✅ 起動完了！";
                }
            });
        }
    </script>
</body>
</html>
